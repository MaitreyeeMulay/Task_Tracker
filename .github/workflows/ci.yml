name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  db:
    name: Database tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: tracker
          POSTGRES_DB: incident_tracker_test
          # Throwaway CI-only database on the runner's loopback; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d incident_tracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tracker@localhost:5432/incident_tracker_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run test:db

  image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t incident-tracker:${{ github.sha }} .
      - name: Install Trivy 0.76.2 and Syft 1.57.0 (checksum pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --max-time 120 -o trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          curl -sSfL --max-time 120 -o syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_linux_amd64.tar.gz
          echo "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
      # Gate (SPEC): fail on a critical vulnerability that has a fix available.
      - name: Image scan (Trivy)
        run: >-
          ${{ runner.temp }}/trivy image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1
          incident-tracker:${{ github.sha }}
      - name: Image scan report (all severities, informational)
        if: always()
        run: >-
          ${{ runner.temp }}/trivy image --no-progress --severity HIGH,CRITICAL --exit-code 0 --format table
          incident-tracker:${{ github.sha }} | tee trivy-report.txt
      - name: SBOM (Syft, CycloneDX)
        run: ${{ runner.temp }}/syft incident-tracker:${{ github.sha }} -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-sbom-and-scan-${{ github.sha }}
          path: |
            sbom.cdx.json
            trivy-report.txt
          if-no-files-found: warn
          retention-days: 30

  terraform:
    name: Terraform fmt, validate, test, tflint, Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - run: tflint --init
        env:
          # Read-only token, only to avoid GitHub API rate limits when fetching the pinned plugin.
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact
      # Open-source Checkov has no severities (they need a paid API key), so
      # this fails on ANY failed check. Skips need a reason in docs/security-decisions.md.
      - name: Checkov
        run: >-
          docker run --rm -v "$PWD:/tf:ro"
          bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
          --directory /tf --framework terraform --quiet --compact
      - name: Install Conftest 0.71.1 (checksum pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --max-time 60 -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz conftest
      # Policy as code (SPEC): no public data stores, private endpoints, tags
      # present. The policies' own unit tests run first.
      - name: Policy as code (Conftest)
        run: |
          "$RUNNER_TEMP/conftest" verify --policy ../policy/terraform
          "$RUNNER_TEMP/conftest" verify --policy ../policy/deploy
          find . -name '*.tf' -not -path './.terraform/*' -print0 \
            | xargs -0 "$RUNNER_TEMP/conftest" test --parser hcl2 --policy ../policy/terraform

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --max-time 60 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ${{ runner.temp }}/gitleaks git --redact --verbose --exit-code 1 .

  dependencies:
    name: Dependency audit (fail on critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --audit-level=critical
