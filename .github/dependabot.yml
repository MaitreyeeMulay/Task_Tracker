version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x supports TypeScript <6.1 only; the TS 7 PR fails
      # npm ci (CI run 40519808656). Remove when typescript-eslint supports 7.
      # Recorded in docs/decisions.md and docs/security-decisions.md.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
